services:
  web:
    build: .
    container_name: django_web
    command: python manage.py runserver 0.0.0.0:8000 --noworker
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: .
    container_name: django_worker
    command: python manage.py runworker
    volumes:
      - .:/app
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"